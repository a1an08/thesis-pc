[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "OctoPrint-Data-Collector"
version = "0.1.0"
description = "OctoPrint plugin for capturing timestamped webcam images and printer data"
authors = [
    { name = "Your Name", email = "your@email.com" }
]
license = { text = "MIT" }
requires-python = ">=3.7,<4"

dependencies = [
    "requests"
]

[project.urls]
Homepage = "https://github.com/yourname/octoprint-data-collector"
